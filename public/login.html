<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Management Systems - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f8fafc;
      --app-bg: #ffffff;
      --brand-primary: #0284c7;
      --brand-primary-dark: #0369a1;
      --brand-primary-glow: rgba(2, 132, 199, 0.35);
      --accent-orange: #f97316;
      --accent-cyan: #38bdf8;
      --accent-red: #ff4757;
      --dark-banner-top: #0f172a;
      --dark-banner-bot: #1e293b;
      --input-bg: #f1f5f9;
      --input-border: #cbd5e1;
      --input-text: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-canvas);
      color: #0f172a;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-viewport {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      background: var(--app-bg);
      box-shadow: 0 20px 45px -12px rgba(15, 23, 42, 0.15), 0 0 1px 1px rgba(15, 23, 42, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* TOP BANNER (PHOTO 1) */
    .top-hero-banner {
      background: linear-gradient(160deg, var(--dark-banner-top) 0%, var(--dark-banner-bot) 100%);
      border-bottom-left-radius: 42px;
      border-bottom-right-radius: 42px;
      padding: 30px 20px 38px 20px;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.35);
      border-bottom: 2px solid rgba(56, 189, 248, 0.2);
    }

    .title-school {
      font-family: 'Permanent Marker', cursive;
      font-size: 40px;
      line-height: 1;
      color: var(--accent-orange);
      text-transform: uppercase;
      letter-spacing: 2px;
      transform: rotate(-3deg);
      display: block;
      text-shadow: 0 4px 14px rgba(249, 115, 22, 0.4);
    }

    .title-management {
      font-family: 'Permanent Marker', cursive;
      font-size: 44px;
      line-height: 1.05;
      color: var(--accent-orange);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transform: rotate(-4deg);
      display: block;
      margin-top: -2px;
      text-shadow: 0 4px 14px rgba(249, 115, 22, 0.4);
    }

    .title-systems {
      font-family: 'Permanent Marker', cursive;
      font-size: 48px;
      line-height: 0.9;
      color: var(--accent-cyan);
      transform: rotate(-7deg);
      display: inline-block;
      margin-top: -14px;
      margin-left: 70px;
      text-shadow: 0 4px 16px rgba(56, 189, 248, 0.5);
    }

    /* LOGIN FORM (PHOTO 1) */
    .login-content {
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      flex: 1;
      justify-content: center;
    }

    .login-row {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 440px;
      justify-content: space-between;
    }

    .login-row label {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.6px;
      color: #0f172a;
      width: 130px;
    }

    .login-input {
      flex: 1;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      outline: none;
      height: 46px;
      border-radius: 8px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 600;
      color: var(--input-text);
      transition: all 0.2s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
    }

    .login-input:focus {
      background: #ffffff;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px var(--brand-primary-glow);
    }

    .btn-login {
      background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-primary-dark) 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.5px;
      padding: 12px 55px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 8px 18px var(--brand-primary-glow);
      transition: all 0.2s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(2, 132, 199, 0.45);
    }

    .error-box {
      display: none;
      color: #ef4444;
      background: #fee2e2;
      border: 1px solid #f87171;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    /* BOTTOM NEWS & REMINDERS BANNER (PHOTO 1) */
    .news-reminders-banner {
      position: relative;
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%);
      padding: 24px 15px;
      text-align: center;
      margin: 15px 15px 18px 15px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
      border-top: 1px solid rgba(255, 71, 87, 0.2);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s;
    }

    .news-reminders-banner:hover {
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.35);
    }

    .news-faded-bg {
      font-family: 'Permanent Marker', cursive;
      font-size: 52px;
      color: rgba(148, 163, 184, 0.25);
      line-height: 0.8;
      transform: rotate(-6deg);
      display: block;
      margin-bottom: -15px;
      letter-spacing: 1px;
    }

    .reminders-fg {
      font-family: 'Permanent Marker', cursive;
      font-size: 60px;
      color: var(--accent-red);
      transform: rotate(-6deg);
      display: block;
      text-shadow: 0 4px 18px rgba(255, 71, 87, 0.5);
      line-height: 1;
    }

    /* Modal / Drawer */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal-drawer {
      background: #ffffff;
      width: 100%;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 26px;
      box-shadow: 0 -12px 35px rgba(0,0,0,0.3);
      border-top: 3px solid var(--accent-red);
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <!-- TOP BANNER -->
    <div class="top-hero-banner">
      <span class="title-school">SCHOOL</span>
      <span class="title-management">MANAGEMENT</span>
      <span class="title-systems">systems</span>
    </div>

    <!-- LOGIN FORM -->
    <form class="login-content" id="login-form">
      <div id="error-msg" class="error-box"></div>

      <div class="login-row">
        <label for="username">USER NAME</label>
        <input type="text" id="username" class="login-input" placeholder="admin" required autofocus>
      </div>

      <div class="login-row">
        <label for="password">PASSWORD</label>
        <input type="password" id="password" class="login-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-login" id="btn-login">Login</button>
      <button type="button" onclick="tryDemo()" style="background:none; border:none; color:#64748b; font-size:12px; cursor:pointer; font-weight:700; margin-top:-10px;">Try Demo Mode</button>
    </form>

    <!-- BOTTOM BANNER -->
    <div class="news-reminders-banner" onclick="openNewsModal()">
      <span class="news-faded-bg">NEWS &</span>
      <span class="reminders-fg">REMINDERS</span>
    </div>

    <!-- NEWS & REMINDERS DRAWER -->
    <div id="news-modal" class="modal-overlay" onclick="closeNewsModal(event)">
      <div class="modal-drawer">
        <h3 style="margin-bottom:12px; font-weight:900; color:var(--accent-red);">📢 NEWS & REMINDERS</h3>
        <p style="margin-bottom:8px; font-weight:600; color:#334155;">• Mid-term examinations schedule has been uploaded.</p>
        <p style="margin-bottom:8px; font-weight:600; color:#334155;">• Fee clearance deadline for Term 2 is this Friday.</p>
        <p style="margin-bottom:18px; font-weight:600; color:#334155;">• Parents & Teachers Annual Assembly at 2:00 PM.</p>
        <button class="btn-login" style="width:100%; padding:10px;" onclick="document.getElementById('news-modal').classList.remove('open')">Dismiss</button>
      </div>
    </div>
  </div>

  <script>
    const BASE = window.location.protocol === 'file:' ? 'http://localhost:3005' : window.location.origin;

    function openNewsModal() {
      document.getElementById('news-modal').classList.add('open');
    }
    function closeNewsModal(e) {
      if (e.target.id === 'news-modal') {
        document.getElementById('news-modal').classList.remove('open');
      }
    }

    async function tryDemo() {
      try {
        const res = await fetch(`${BASE}/api/login/demo`, { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('jomish_token', data.token);
          localStorage.setItem('jomish_role', data.role);
          localStorage.setItem('jomish_name', data.name);
          localStorage.setItem('jomish_permissions', JSON.stringify(data.permissions));
          localStorage.setItem('jomish_user_id', data.user_id);
          localStorage.setItem('jomish_prefix', data.prefix);
          localStorage.setItem('jomish_demo', 'true');
          window.location.href = 'index.html';
          return;
        }
      } catch (e) {}
      // Client-side demo fallback
      localStorage.setItem('jomish_token', 'DEMO_TOKEN');
      localStorage.setItem('jomish_role', 'ADMIN');
      localStorage.setItem('jomish_name', 'Administrator');
      window.location.href = 'index.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-msg');
      const btn = document.getElementById('btn-login');

      errorEl.style.display = 'none';
      btn.textContent = 'Logging in...';
      btn.disabled = true;

      try {
        const res = await fetch(`${BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('jomish_token', data.token);
          localStorage.setItem('jomish_role', data.role);
          localStorage.setItem('jomish_name', data.name);
          localStorage.setItem('jomish_permissions', JSON.stringify(data.permissions));
          localStorage.setItem('jomish_user_id', data.user_id);
          if (data.prefix) localStorage.setItem('jomish_prefix', data.prefix);
          window.location.href = 'index.html';
        } else {
          errorEl.textContent = data.error || 'Invalid credentials';
          errorEl.style.display = 'block';
          btn.textContent = 'Login';
          btn.disabled = false;
        }
      } catch (err) {
        // Direct local or demo fallback
        if (username.toLowerCase() === 'admin' && (password === '1234' || password === 'admin' || password === '123456')) {
          localStorage.setItem('jomish_token', 'OFFLINE_DEMO');
          localStorage.setItem('jomish_role', 'ADMIN');
          localStorage.setItem('jomish_name', 'Administrator');
          window.location.href = 'index.html';
          return;
        }
        errorEl.textContent = 'Unable to reach server. Try demo mode or check connection.';
        errorEl.style.display = 'block';
        btn.textContent = 'Login';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
