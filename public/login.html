<script>
window.onerror = function(msg, url, line, col, error) {
    document.body.innerHTML += '<div style="color:red;z-index:9999;position:relative;">ERROR: ' + msg + '<br>Line: ' + line + '</div>';
};
window.onunhandledrejection = function(e) {
    document.body.innerHTML += '<div style="color:red;z-index:9999;position:relative;">PROMISE REJECTION: ' + e.reason + '</div>';
};
</script>

    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{--cyan:#00e5ff;--magenta:#e040fb;--dark:#0c0c1a;--card:#161628;--input-bg:#1e1e35;--border:rgba(255,255,255,0.06);--text:#eee;--muted:#7a7a9a;--radius:14px}
        body{font-family:'Segoe UI',-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--dark);overflow:hidden}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(0,229,255,0.06),transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(224,64,251,0.05),transparent 60%);pointer-events:none}

        .card-wrap{position:relative;z-index:10;padding:3px;border-radius:22px;animation:cardIn .5s ease both}
        @keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}

        .card-wrap::before{content:'';position:absolute;inset:-2px;border-radius:22px;background:repeating-conic-gradient(from var(--angle,0deg),var(--cyan) 0%,var(--magenta) 5%,transparent 5%,transparent 40%,var(--cyan) 50%);filter:drop-shadow(0 15px 50px rgba(0,229,255,0.15));animation:spinBorder 4s linear infinite;z-index:-1}
        @property --angle{syntax:'<angle>';initial-value:0deg;inherits:false}
        @keyframes spinBorder{to{--angle:360deg}}
        .card-wrap::after{content:'';position:absolute;inset:-2px;border-radius:22px;background:repeating-conic-gradient(from var(--angle,0deg),var(--cyan) 0%,var(--magenta) 5%,transparent 5%,transparent 40%,var(--cyan) 50%);filter:blur(20px);opacity:.3;animation:spinBorder 4s linear infinite;z-index:-2}

        .login-card{background:var(--card);border-radius:20px;padding:44px 38px 36px;width:min(400px,90vw);position:relative}
        .brand-section{display:flex;flex-direction:column;align-items:center;margin-bottom:28px;gap:10px}
        .brand-logo-wrap{width:68px;height:68px;background:rgba(0,229,255,0.08);border:1.5px solid rgba(0,229,255,0.2);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
        .brand-logo-wrap img#login-logo{display:none;width:100%;height:100%;object-fit:cover;border-radius:16px}
        .brand-logo-placeholder{font-size:1.8rem; color: var(--cyan);}
        .brand-name{font-size:1.3rem;font-weight:800;letter-spacing:-.3px;text-align:center;color:var(--text)}
        .brand-name span{background:linear-gradient(135deg,var(--cyan),var(--magenta));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .brand-tagline{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:500}

        .form-heading{font-size:.88rem;color:var(--muted);margin-bottom:18px;text-align:center}
        .field{position:relative;margin-bottom:14px}
        .field label{display:block;font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
        .field input{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:13px 16px;border-radius:var(--radius);font-size:.92rem;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
        .field input::placeholder{color:#4a4a65}
        .field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,0.1)}
        .eye-btn{position:absolute;right:14px;bottom:13px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem}

        #error-msg{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#f87171;padding:10px;border-radius:10px;font-size:.82rem;margin-bottom:12px;text-align:center}
        #terminated-msg{display:none;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);color:#fbbf24;padding:12px;border-radius:10px;font-size:.82rem;margin-bottom:12px;text-align:center;line-height:1.5}
        #terminated-msg strong{display:block;font-size:.9rem;margin-bottom:4px}

        .id-hint{font-size:.72rem;color:var(--muted);margin-top:4px;padding-left:2px}
        .id-hint code{background:rgba(0,229,255,0.08);color:var(--cyan);padding:1px 5px;border-radius:4px;font-size:.7rem}

        .submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,#00e5ff,#00b8d4);color:#0c0c1a;border:none;border-radius:var(--radius);font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px;transition:transform .15s,box-shadow .2s;box-shadow:0 4px 24px rgba(0,229,255,0.25);letter-spacing:.3px}
        .submit-btn:hover{transform:translateY(-1px);box-shadow:0 8px 32px rgba(0,229,255,0.35)}
        .submit-btn:active{transform:translateY(1px)}
        .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

        .login-footer{text-align:center;margin-top:20px;font-size:.7rem;color:#3a3a55}
        .login-footer strong{color:#5a5a75}

        @keyframes spin-load{to{transform:rotate(360deg)}}
        .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(12,12,26,0.3);border-top-color:#0c0c1a;border-radius:50%;animation:spin-load .7s linear infinite;vertical-align:middle;margin-right:6px}
        @media(max-width:500px){.login-card{padding:32px 24px 28px}}
    </style>
</head>
<body>
    <div class="card-wrap">
        <div class="login-card">
            <div class="brand-section">
                <div class="brand-logo-wrap">
                    <i class="fa-solid fa-school brand-logo-placeholder" id="logo-placeholder"></i>
                    <img id="login-logo" alt="Company Logo">
                </div>
                <div>
                    <div class="brand-name"><span>School</span> System</div>
                    <div class="brand-tagline">Secure Authentication Area</div>
                </div>
            </div>

            <p class="form-heading">Sign in to your workspace</p>
            <div id="success-msg" style="display:none; background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.25); color:#34d399; padding:12px; border-radius:10px; font-size:.82rem; margin-bottom:12px; text-align:center; line-height:1.5;"></div>
            <div id="error-msg"></div>
            <div id="terminated-msg">
                <strong>Account Terminated</strong>
                Your access has been permanently revoked. Contact HR for assistance.
            </div>

            <form id="login-form" autocomplete="on">
                <div class="field">
                    <label>User ID / User name</label>
                    <input type="text" id="username" placeholder="Enter User ID or User name" required autocomplete="username" style="text-transform:uppercase;" oninput="const s=this.selectionStart,e=this.selectionEnd;this.value=this.value.toUpperCase();this.setSelectionRange(s,e);">
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                    <button type="button" class="eye-btn" id="toggle-pwd" title="Show/Hide">&#x1F441;</button>
                </div>
                <button type="submit" class="submit-btn" id="btn-signin">Sign In</button>
                <button type="button" class="submit-btn" id="btn-demo" style="margin-top: 10px; background: linear-gradient(135deg, #e040fb, #b020c0); color: white;">Try Demo</button>
            </form>

            <div class="login-footer">
                <strong>Jomish Enterprise Workforce Platform</strong>
            </div>
        </div>
    </div>

    <script>
        const BASE = window.location.protocol === 'file:' ? 'http://localhost:3005' : window.location.origin;

        // Branding is now static as requested


        function checkReset() {
            const params = new URLSearchParams(window.location.search);
            const msg = document.getElementById('success-msg');
            
            if (params.get('reset') === 'success' && msg) {
                msg.style.display = 'block';
                msg.innerHTML = `<strong>System Reset Successful!</strong><br>The database is clean and ready.`;
            }
        }
        checkReset();

        document.getElementById('toggle-pwd').addEventListener('click', () => {
            const pwd = document.getElementById('password');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
        });

        // ── Offline credential helpers ────────────────────────────────────────
        async function hashPassword(password, salt) {
            const enc = new TextEncoder();
            const data = enc.encode(password + salt);
            const buf  = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function saveOfflineCreds(username, password, profile) {
            // salt = username so two users with same password get different hashes
            const hash = await hashPassword(password, username.toLowerCase());
            const creds = {
                username: username.toLowerCase(),
                hash,
                // NOTE: We do NOT store the JWT token — it becomes stale when
                // someone logs in from another device and gets a new session token.
                // Offline login will re-use role/permissions only and set offline_mode.
                role:        profile.role,
                name:        profile.name,
                permissions: profile.permissions,
                user_id:     profile.user_id,
                prefix:      profile.prefix || ''
            };
            localStorage.setItem('jomish_offline_creds', JSON.stringify(creds));
        }

        async function tryOfflineLogin(username, password) {
            const raw = localStorage.getItem('jomish_offline_creds');
            if (!raw) return null;
            const creds = JSON.parse(raw);
            if (creds.username !== username.toLowerCase()) return null;
            const hash = await hashPassword(password, username.toLowerCase());
            if (hash !== creds.hash) return null;
            return creds; // valid offline credentials
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn     = document.getElementById('btn-signin');
            const errorEl = document.getElementById('error-msg');
            const usernameVal = document.getElementById('username').value.trim();
            const passwordVal = document.getElementById('password').value;
            errorEl.style.display = 'none';
            document.getElementById('terminated-msg').style.display = 'none';

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Signing in...';

            try {
                const res = await fetch(`${BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameVal, password: passwordVal })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.removeItem('jomish_demo');
                    localStorage.removeItem('jomish_offline_mode');
                    // Clear any stale offline creds before saving fresh ones
                    localStorage.removeItem('jomish_offline_creds');
                    localStorage.setItem('jomish_token', data.token);
                    localStorage.setItem('jomish_role', data.role);
                    localStorage.setItem('jomish_name', data.name);
                    localStorage.setItem('jomish_permissions', JSON.stringify(data.permissions));
                    localStorage.setItem('jomish_user_id', data.user_id);
                    if (data.prefix) localStorage.setItem('jomish_prefix', data.prefix);

                    // Save hashed credentials for future offline logins (no token stored)
                    await saveOfflineCreds(usernameVal, passwordVal, {
                        role: data.role, name: data.name,
                        permissions: data.permissions, user_id: data.user_id, prefix: data.prefix
                    });

                    window.location.href = 'index.html';
                } else {
                    const terminatedEl = document.getElementById('terminated-msg');
                    const isTerminated = res.status === 403 && data.error && data.error.includes('terminated');
                    if (isTerminated) {
                        terminatedEl.style.display = 'block';
                    } else {
                        errorEl.style.display = 'block';
                        errorEl.textContent = data.error || 'Invalid credentials';
                    }
                    btn.disabled = false;
                    btn.innerHTML = 'Sign In';
                }
            } catch (err) {
                // ── Offline Fallback Login ────────────────────────────────────
                // Server unreachable — check if credentials match saved offline cache
                const offline = await tryOfflineLogin(usernameVal, passwordVal);
                if (offline) {
                    // Restore session in offline mode.
                    // We store a sentinel value 'OFFLINE_MODE' as the token so the
                    // index.html auth guard passes, but fetchAuth() knows not to send
                    // it to the server (which would cause a 401 rejection).
                    localStorage.setItem('jomish_token',       'OFFLINE_MODE');
                    localStorage.setItem('jomish_role',        offline.role);
                    localStorage.setItem('jomish_name',        offline.name);
                    localStorage.setItem('jomish_permissions', JSON.stringify(offline.permissions));
                    localStorage.setItem('jomish_user_id',     offline.user_id);
                    if (offline.prefix) localStorage.setItem('jomish_prefix', offline.prefix);
                    localStorage.setItem('jomish_offline_mode', 'true');
                    window.location.href = 'index.html';
                } else {
                    errorEl.style.display = 'block';
                    if (!navigator.onLine) {
                        errorEl.innerHTML = '📴 <strong>Offline</strong> — no server connection.<br>Use your normal username & password to log in offline.';
                    } else {
                        errorEl.textContent = 'Cannot reach server. Is the system running?';
                    }
                    btn.disabled = false;
                    btn.innerHTML = 'Sign In';
                }
            }
        });

        document.getElementById('btn-demo').addEventListener('click', async () => {
            const btn = document.getElementById('btn-demo');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Starting Demo...';
            try {
                const res = await fetch(`${BASE}/api/login/demo`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('jomish_token', data.token);
                    localStorage.setItem('jomish_role', data.role);
                    localStorage.setItem('jomish_name', data.name);
                    localStorage.setItem('jomish_permissions', JSON.stringify(data.permissions));
                    localStorage.setItem('jomish_user_id', data.user_id);
                    localStorage.setItem('jomish_prefix', data.prefix);
                    localStorage.setItem('jomish_demo', 'true');
                    window.location.href = 'index.html';
                }
            } catch (err) {
                alert('Demo login failed: ' + err.message);
                btn.disabled = false;
                btn.innerHTML = 'Try Demo Mode';
            }
        });
    </script>
</body>
</html>
