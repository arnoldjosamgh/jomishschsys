<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Minutes Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4285F4;
            --background: #ffffff;
            --text: #1E293B;
            --border: #E2E8F0;
            --surface: #F8FAFC;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--surface);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        textarea {
            flex: 1;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.2);
        }
        button {
            padding: 12px;
            background: linear-gradient(135deg, #4285F4, #34A853);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #status {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 10px;
            color: #10B981;
            font-weight: bold;
            min-height: 16px;
        }
    </style>
</head>
<body>
    <h2><i class="fa-solid fa-pen-to-square"></i> Minutes Editor</h2>
    <textarea id="minutes-text" placeholder="Type your meeting minutes here..."></textarea>
    <button id="btn-save"><i class="fa-solid fa-floppy-disk"></i> Save Minutes</button>
    <div id="status"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('eventId');
        // Use dynamic origin so this works when served from any LAN IP (not just localhost)
        const API_URL = (window.location.protocol === 'file:' ? 'http://localhost:3005' : window.location.origin) + '/api';

        // Basic fetch wrapper using the token from main window (we will pass it via URL or just read localStorage)
        // Since it's a separate window but same domain, localStorage is shared!
        const token = localStorage.getItem('jomish_token');

        async function fetchAuth(url, options = {}) {
            const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
            return fetch(url, { ...options, headers });
        }

        async function loadExistingMinutes() {
            if (!eventId) return;
            try {
                // To get existing minutes, we can fetch all events for the current month and find it
                const today = new Date();
                const m = today.getMonth() + 1;
                const y = today.getFullYear();
                const res = await fetchAuth(`${API_URL}/calendar/events?month=${m}&year=${y}`);
                const data = await res.json();
                const ev = (data.events || []).find(e => e.id == eventId);
                if (ev && ev.minutes) {
                    document.getElementById('minutes-text').value = ev.minutes;
                }
            } catch (e) {
                console.error(e);
            }
        }

        document.getElementById('btn-save').addEventListener('click', async () => {
            if (!eventId) return;
            const text = document.getElementById('minutes-text').value.trim();
            const statusDiv = document.getElementById('status');
            
            try {
                statusDiv.innerText = 'Saving...';
                statusDiv.style.color = '#94A3B8';
                
                const res = await fetchAuth(`${API_URL}/calendar/events/${eventId}/minutes`, {
                    method: 'POST',
                    body: JSON.stringify({ minutes: text })
                });
                
                if (res.ok) {
                    statusDiv.innerHTML = '<i class="fa-solid fa-check"></i> Saved successfully!';
                    statusDiv.style.color = '#10B981';
                    setTimeout(() => statusDiv.innerText = '', 3000);
                } else {
                    statusDiv.innerHTML = '<i class="fa-solid fa-xmark"></i> Failed to save';
                    statusDiv.style.color = '#EF4444';
                }
            } catch (e) {
                statusDiv.innerHTML = '<i class="fa-solid fa-xmark"></i> Connection error';
                statusDiv.style.color = '#EF4444';
            }
        });

        if (token && eventId) {
            loadExistingMinutes();
        } else {
            document.getElementById('minutes-text').value = 'Error: Missing authentication or event ID.';
            document.getElementById('minutes-text').disabled = true;
            document.getElementById('btn-save').disabled = true;
        }
    </script>
</body>
</html>
