<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOS Portal - School System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg, #0f0f1a); color: #fff; font-family: 'Inter', sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1a1a2e; padding: 30px; border-radius: 12px; }
        h2 { border-bottom: 1px solid #333; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #a0a0b0; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #0f0f1a; color: #fff; }
        .btn { padding: 10px 15px; background: #4F46E5; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #4338ca; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>DOS Portal</h2>
        
        <div class="grid">
            <!-- Add Teacher -->
            <div>
                <h3>Add Teacher</h3>
                <form id="addTeacherForm">
                    <div class="form-group"><label>First Name</label><input type="text" id="t_fname" required></div>
                    <div class="form-group"><label>Last Name</label><input type="text" id="t_lname" required></div>
                    <div class="form-group"><label>Email</label><input type="email" id="t_email" required></div>
                    <div class="form-group"><label>Phone</label><input type="text" id="t_phone"></div>
                    <div class="form-group"><label>Password</label><input type="password" id="t_password" required></div>
                    <button type="submit" class="btn">Add Teacher</button>
                </form>
            </div>

            <!-- Assign Subjects -->
            <div>
                <h3>Assign Class & Subject</h3>
                <form id="assignForm">
                    <div class="form-group">
                        <label>Teacher ID</label>
                        <input type="text" id="a_teacher_id" required>
                    </div>
                    <div class="form-group">
                        <label>Class ID</label>
                        <input type="text" id="a_class_id" required>
                    </div>
                    <div class="form-group">
                        <label>Subject ID</label>
                        <input type="text" id="a_subject_id" required>
                    </div>
                    <button type="submit" class="btn">Assign</button>
                </form>
            </div>
        </div>

        <hr style="margin: 40px 0; border-color: #333;">

        <!-- Admin Generate DOS Invite (Normally would be in Admin panel) -->
        <h3>Generate DOS Invite Link (Admin/Headteacher Only)</h3>
        <form id="inviteForm">
            <div class="form-group">
                <label>DOS Email</label>
                <input type="email" id="i_email" required>
            </div>
            <div class="form-group">
                <label>Levels in Charge (hold Ctrl to select multiple)</label>
                <select id="i_levels" multiple style="height: 100px;">
                    <optgroup label="Nursery">
                        <option value="Baby Class">Baby Class</option>
                        <option value="Middle">Middle</option>
                        <option value="Top">Top</option>
                    </optgroup>
                    <optgroup label="Primary">
                        <option value="P1">P1</option>
                        <option value="P2">P2</option>
                        <option value="P3">P3</option>
                        <option value="P4">P4</option>
                        <option value="P5">P5</option>
                        <option value="P6">P6</option>
                        <option value="P7">P7</option>
                    </optgroup>
                    <optgroup label="Secondary (Olevel)">
                        <option value="S1">S1</option>
                        <option value="S2">S2</option>
                        <option value="S3">S3</option>
                        <option value="S4">S4</option>
                    </optgroup>
                    <optgroup label="Secondary (Alevel)">
                        <option value="S5">S5</option>
                        <option value="S6">S6</option>
                    </optgroup>
                    <option value="University">University</option>
                </select>
            </div>
            <button type="submit" class="btn">Generate Link</button>
        </form>
        <div id="inviteResult" style="margin-top: 15px; color: #4ade80;"></div>
    </div>

    <script>
        const token = localStorage.getItem('jomish_token');
        
        document.getElementById('addTeacherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/dos/teachers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({
                    first_name: document.getElementById('t_fname').value,
                    last_name: document.getElementById('t_lname').value,
                    email: document.getElementById('t_email').value,
                    phone: document.getElementById('t_phone').value,
                    password: document.getElementById('t_password').value
                })
            });
            const data = await res.json();
            if (data.error) alert(data.error);
            else alert('Teacher added! Username: ' + data.username + ', ID: ' + data.teacher_id);
        });

        document.getElementById('assignForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const teacher_id = document.getElementById('a_teacher_id').value;
            const res = await fetch(`/api/dos/teachers/${teacher_id}/assignments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({
                    class_id: document.getElementById('a_class_id').value,
                    subject_id: document.getElementById('a_subject_id').value
                })
            });
            const data = await res.json();
            if (data.error) alert(data.error);
            else alert('Assigned successfully!');
        });

        document.getElementById('inviteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const options = document.getElementById('i_levels').selectedOptions;
            const levels = Array.from(options).map(opt => opt.value);
            
            const res = await fetch('/api/dos/invite-link', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({
                    email: document.getElementById('i_email').value,
                    levels_in_charge: levels
                })
            });
            const data = await res.json();
            if (data.error) alert(data.error);
            else {
                document.getElementById('inviteResult').innerHTML = `Link: <a href="${data.link}" target="_blank" style="color:#60a5fa">${data.link}</a>`;
            }
        });
    </script>
</body>
</html>
