<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- Primary Meta Tags -->
    <title>Terminal — Jomish Suite</title>
    <meta name="title" content="Terminal — Jomish Suite">
    <meta name="description" content="All-in-one business management platform for HR, POS, SME and more.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Terminal — Jomish Suite">
    <meta property="og:description" content="All-in-one business management platform for HR, POS, SME and more.">
    <meta property="og:image" content="/favicon.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Terminal — Jomish Suite">
    <meta property="twitter:description" content="All-in-one business management platform for HR, POS, SME and more.">
    <meta property="twitter:image" content="/favicon.png">
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#161640;--surface:#1e1e52;--card:#272768;--border:rgba(255,255,255,0.08);--accent:#d4a24e;--accent-soft:rgba(212,162,78,0.15);--green:#4ecca3;--green-soft:rgba(78,204,163,0.14);--red:#e85d5d;--red-soft:rgba(232,93,93,0.14);--blue:#6fa3e8;--blue-soft:rgba(111,163,232,0.14);--text:#f0eadd;--text-2:#a8a0c0;--text-3:#6e6890;--radius:18px}
        body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}

        /* Top bar */
        .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--border);background:var(--surface);border-radius:0 0 24px 24px}
        .topbar-left{display:flex;align-items:center;gap:14px}
        .topbar-left img{height:38px;border-radius:12px;display:none}
        .topbar-title{font-size:1.05rem;font-weight:700;letter-spacing:-0.3px}
        .topbar-sub{font-size:0.72rem;color:var(--text-3);margin-top:1px;letter-spacing:0.3px}
        .topbar-right{text-align:right}
        .clock{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.5px;color:var(--accent)}
        .date-line{font-size:0.72rem;color:var(--text-3);margin-top:2px}
        .conn-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
        .conn-dot.on{background:var(--green)}
        .conn-dot.off{background:var(--red)}
        .conn-label{font-size:0.68rem;color:var(--text-3)}
        .op-tag{display:inline-block;font-size:0.68rem;color:var(--accent);background:var(--accent-soft);padding:4px 12px;border-radius:20px;margin-top:4px;font-weight:600}

        /* Main content */
        .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:24px}

        /* Scan area */
        .scan-area{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:44px 42px;text-align:center;max-width:460px;width:100%;position:relative;transition:border-color .3s,box-shadow .3s;box-shadow:0 8px 32px rgba(0,0,0,0.25)}
        .scan-area.active{border-color:rgba(212,162,78,0.25);box-shadow:0 8px 40px rgba(212,162,78,0.08)}
        .scan-area h2{font-size:1.25rem;font-weight:700;margin-bottom:6px;letter-spacing:-0.3px}
        .scan-area p{font-size:0.82rem;color:var(--text-2);line-height:1.5}
        .scan-line{width:48px;height:3px;background:linear-gradient(90deg,var(--accent),#e8c96a);border-radius:3px;margin:18px auto 20px}
        .input-row{display:flex;gap:8px;margin-top:18px}
        .input-row input{flex:1;padding:13px 16px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,0.06);color:var(--text);font-size:0.92rem;font-family:inherit;outline:none;transition:border-color .2s}
        .input-row input:focus{border-color:var(--accent);background:rgba(255,255,255,0.09)}
        .input-row button,.btn{padding:12px 22px;border-radius:14px;border:none;background:linear-gradient(135deg,#d4a24e,#c48930);color:#1a1a3e;font-size:0.85rem;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s}
        .btn:active{transform:scale(0.96)}
        .btn-ghost{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text-2);font-size:0.78rem;margin-top:12px;padding:9px 18px;border-radius:14px}

        /* Activity feed */
        .feed{background:var(--card);border:1px solid var(--border);border-radius:22px;max-width:460px;width:100%;max-height:180px;overflow-y:auto;padding:16px 18px;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
        .feed-title{font-size:0.68rem;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:10px}
        .feed-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:0.82rem}
        .feed-item:last-child{border:none}
        .feed-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
        .feed-dot.in{background:var(--green)}
        .feed-dot.out{background:var(--blue)}
        .feed-name{flex:1;font-weight:500}
        .feed-meta{color:var(--text-3);font-size:0.72rem}

        /* Result overlay */
        .overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(10,10,40,.75);backdrop-filter:blur(8px)}
        .overlay.show{display:flex}
        .res-card{padding:40px 48px;border-radius:28px;text-align:center;min-width:340px;animation:rise .25s ease-out;box-shadow:0 12px 48px rgba(0,0,0,0.35)}
        @keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
        .res-card.ok{background:var(--card);border:1px solid rgba(78,204,163,.3)}
        .res-card.bad{background:var(--card);border:1px solid rgba(232,93,93,.3)}
        .res-card.note{background:var(--card);border:1px solid rgba(212,162,78,.3)}
        .res-indicator{width:52px;height:52px;border-radius:16px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700}
        .ok .res-indicator{background:var(--green-soft);color:var(--green)}
        .bad .res-indicator{background:var(--red-soft);color:var(--red)}
        .note .res-indicator{background:var(--blue-soft);color:var(--blue)}
        .res-name{font-size:1.3rem;font-weight:700;margin-bottom:4px;letter-spacing:-0.3px}
        .res-msg{font-size:0.85rem;color:var(--text-2)}
        .res-time{font-size:0.72rem;color:var(--text-3);margin-top:8px}

        /* Login gate */
        .gate{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center}
        .gate.off{display:none}
        .gate-box{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:38px 34px;width:min(380px,90vw);box-shadow:0 16px 56px rgba(0,0,0,0.4)}
        .gate-box h2{font-size:1.15rem;font-weight:700;margin-bottom:4px;letter-spacing:-0.2px}
        .gate-box .sub{font-size:0.78rem;color:var(--text-3);margin-bottom:22px}
        .gate-box label{display:block;font-size:0.7rem;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
        .gate-box input{width:100%;padding:12px 15px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,0.06);color:var(--text);font-size:0.9rem;font-family:inherit;outline:none;margin-bottom:13px}
        .gate-box input:focus{border-color:var(--accent);background:rgba(255,255,255,0.09)}
        .gate-btn{width:100%;padding:13px;border:none;border-radius:14px;background:linear-gradient(135deg,#d4a24e,#c48930);color:#1a1a3e;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px;transition:transform .15s}
        .gate-btn:active{transform:scale(0.97)}
        .gate-btn:disabled{opacity:.5}
        .gate-err{display:none;background:var(--red-soft);border:1px solid rgba(232,93,93,.2);color:#f87171;padding:10px;border-radius:14px;font-size:0.8rem;text-align:center;margin-bottom:10px}

        /* Setup modal */
        .modal-bg{position:fixed;inset:0;z-index:300;background:rgba(10,10,40,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
        .modal-bg.hidden{display:none}
        .modal-card{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:32px;max-width:400px;width:90%;box-shadow:0 12px 48px rgba(0,0,0,0.35)}
        .modal-card h2{font-size:1rem;font-weight:700;margin-bottom:14px}
        .modal-card label{display:block;font-size:0.7rem;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
        .modal-card input,.modal-card select{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,0.06);color:var(--text);font-size:0.88rem;font-family:inherit;outline:none;margin-bottom:14px}
        .modal-card select option{background:var(--card)}

        /* Camera */
        #cam-wrap{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);align-items:center;justify-content:center;flex-direction:column;gap:16px}
        #cam-wrap.show{display:flex}
        #cam-reader{width:min(360px,88vw)}

        /* Footer */
        .foot{padding:12px 28px;text-align:center;font-size:0.68rem;color:var(--text-3);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:16px;background:var(--surface);border-radius:24px 24px 0 0}
        .foot button{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:0.68rem;font-family:inherit}
        .foot button:hover{color:var(--accent)}

        @media(max-width:600px){
            .topbar{padding:12px 16px}.clock{font-size:1.2rem}
            .scan-area{padding:28px 22px}.main{padding:16px;gap:16px}
            .res-card{min-width:auto;padding:32px 24px}
            .gate-box{padding:28px 22px}
        }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div class="gate" id="login-gate">
        <div class="gate-box">
            <h2>Sign in to activate</h2>
            <p class="sub">Use your staff credentials to unlock this terminal</p>
            <div class="gate-err" id="kiosk-login-error"></div>
            <label>Username or email</label>
            <input type="text" id="kiosk-username" placeholder="Enter username" autocomplete="username">
            <label>Password</label>
            <input type="password" id="kiosk-password" placeholder="Enter password" autocomplete="current-password">
            <button class="gate-btn" id="kiosk-login-btn" onclick="kioskLogin()">Sign in</button>
        </div>
    </div>

    <!-- SETUP -->
    <div class="modal-bg hidden" id="setup-modal">
        <div class="modal-card">
            <h2>Name this device</h2>
            <label>Device name</label>
            <input type="text" id="setup-name" placeholder="e.g. Main Gate Tablet">
            <label>Device type</label>
            <select id="setup-type">
                <option value="Security Kiosk">Security Kiosk</option>
                <option value="Reception Tablet">Reception Tablet</option>
                <option value="Warehouse Scanner">Warehouse Scanner</option>
                <option value="Office Terminal">Office Terminal</option>
            </select>
            <button class="btn" style="width:100%" onclick="saveDeviceSetup()">Save</button>
        </div>
    </div>

    <!-- TOPBAR -->
    <header class="topbar">
        <div class="topbar-left">
            <img id="kiosk-logo" alt="">
            <div>
                <div class="topbar-title" id="kiosk-biz-name">Jomish Suite</div>
                <div class="topbar-sub" id="device-label">Terminal</div>
                <span class="op-tag" id="operator-badge" style="display:none">Operator: <strong id="operator-name"></strong></span>
            </div>
        </div>
        <div class="topbar-right">
            <div class="clock" id="live-clock">--:--:--</div>
            <div class="date-line" id="live-date"></div>
            <div style="margin-top:4px">
                <span class="conn-dot on" id="status-dot"></span>
                <span class="conn-label" id="status-text">Connected</span>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="main">
        <div class="scan-area active" id="scan-zone">
            <h2>Scan to check in or out</h2>
            <p>Use a barcode scanner or enter the employee code manually below</p>
            <div class="scan-line"></div>
            <div class="input-row">
                <input type="text" id="manual-id" placeholder="Employee code" autocomplete="off">
                <button class="btn" onclick="manualScan()">Submit</button>
            </div>
            <button class="btn btn-ghost" onclick="openCamScanner()">Use camera</button>
        </div>
        <div class="feed" id="activity-log">
            <div class="feed-title">Recent activity</div>
            <div id="log-list"><div class="feed-item" style="justify-content:center;color:var(--text-3)">No scans recorded yet</div></div>
        </div>
    </main>

    <!-- RESULT -->
    <div class="overlay" id="result-overlay">
        <div class="res-card" id="result-card">
            <div class="res-indicator" id="result-icon"></div>
            <div class="res-name" id="result-name"></div>
            <div class="res-msg" id="result-msg"></div>
            <div class="res-time" id="result-time"></div>
        </div>
    </div>

    <!-- CAMERA -->
    <div id="cam-wrap">
        <div id="cam-reader"></div>
        <button class="btn" style="background:var(--red)" onclick="closeCamScanner()">Close camera</button>
    </div>

    <!-- FOOTER -->
    <footer class="foot">
        <span>Jomish Business Suite</span>
        <button onclick="document.getElementById('setup-modal').classList.remove('hidden')">Device settings</button>
        <button onclick="kioskLogout()" id="btn-logout" style="display:none">Lock terminal</button>
    </footer>

    <script src="lib/html5-qrcode.min.js"></script>
    <script src="lib/socket.io.js"></script>
    <script>
    const BASE = window.location.origin;
    const API = `${BASE}/api`;
    let DEVICE_ID = localStorage.getItem('kiosk_device_id');
    let DEVICE_NAME = localStorage.getItem('kiosk_device_name') || 'Unnamed';
    let DEVICE_TYPE = localStorage.getItem('kiosk_device_type') || 'Security Kiosk';
    let scanBuffer = '', scanTimeout = null, activityLog = [];
    let kioskToken = null, camScanner = null, operatorName = '';
    const IDLE_MS = 30 * 60 * 1000;
    let lastActivity = Date.now(), idleInterval = null;

    async function init() {
        if (!DEVICE_ID) {
            DEVICE_ID = 'K_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
            localStorage.setItem('kiosk_device_id', DEVICE_ID);
        }
        document.getElementById('device-label').textContent = DEVICE_NAME;
        startClock(); loadBranding(); pingServer();
        setInterval(pingServer, 60000); initSocket();
        const t = sessionStorage.getItem('kiosk_token');
        const o = sessionStorage.getItem('kiosk_operator');
        if (t && o) { kioskToken = t; operatorName = o; unlock(); }
        else showGate();
        document.getElementById('kiosk-username').addEventListener('keydown', e => { if (e.key==='Enter') kioskLogin(); });
        document.getElementById('kiosk-password').addEventListener('keydown', e => { if (e.key==='Enter') kioskLogin(); });
    }

    function showGate() {
        document.getElementById('login-gate').classList.remove('off');
        document.getElementById('btn-logout').style.display = 'none';
        document.getElementById('operator-badge').style.display = 'none';
        kioskToken = null; operatorName = '';
        sessionStorage.removeItem('kiosk_token'); sessionStorage.removeItem('kiosk_operator');
        if (idleInterval) { clearInterval(idleInterval); idleInterval = null; }
        setTimeout(() => document.getElementById('kiosk-username').focus(), 150);
    }

    async function kioskLogin() {
        const u = document.getElementById('kiosk-username').value.trim();
        const p = document.getElementById('kiosk-password').value;
        const err = document.getElementById('kiosk-login-error');
        const btn = document.getElementById('kiosk-login-btn');
        err.style.display = 'none';
        if (!u || !p) { err.textContent = 'Enter username and password'; err.style.display = 'block'; return; }
        btn.disabled = true; btn.textContent = 'Signing in...';
        try {
            const res = await fetch(`${API}/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u,password:p}) });
            const data = await res.json();
            if (res.ok) {
                kioskToken = data.token; operatorName = data.name;
                sessionStorage.setItem('kiosk_token', data.token);
                sessionStorage.setItem('kiosk_operator', data.name);
                fetch(`${API}/kiosk/auth`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({device_id:DEVICE_ID,device_name:DEVICE_NAME,device_type:DEVICE_TYPE}) });
                if (!localStorage.getItem('kiosk_device_name')) document.getElementById('setup-modal').classList.remove('hidden');
                unlock();
            } else { err.textContent = data.error || 'Invalid credentials'; err.style.display = 'block'; }
        } catch(e) { err.textContent = 'Cannot reach server'; err.style.display = 'block'; }
        btn.disabled = false; btn.textContent = 'Sign in';
        document.getElementById('kiosk-password').value = '';
    }

    function unlock() {
        document.getElementById('login-gate').classList.add('off');
        document.getElementById('btn-logout').style.display = 'inline';
        document.getElementById('operator-badge').style.display = 'inline-block';
        document.getElementById('operator-name').textContent = operatorName;
        lastActivity = Date.now(); startIdle(); initScanner();
    }

    function kioskLogout() { showGate(); document.getElementById('kiosk-username').value = ''; }

    function resetIdle() { lastActivity = Date.now(); }
    function startIdle() {
        ['click','touchstart','keydown','mousemove'].forEach(e => document.addEventListener(e, resetIdle, {passive:true}));
        if (idleInterval) clearInterval(idleInterval);
        idleInterval = setInterval(() => { if (Date.now() - lastActivity >= IDLE_MS) kioskLogout(); }, 5000);
    }

    function saveDeviceSetup() {
        const n = document.getElementById('setup-name').value.trim();
        const t = document.getElementById('setup-type').value;
        if (!n) return;
        DEVICE_NAME = n; DEVICE_TYPE = t;
        localStorage.setItem('kiosk_device_name', n);
        localStorage.setItem('kiosk_device_type', t);
        document.getElementById('device-label').textContent = n;
        document.getElementById('setup-modal').classList.add('hidden');
        pingServer();
    }

    async function pingServer() {
        try {
            await fetch(`${API}/devices/ping`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({device_id:DEVICE_ID,device_name:DEVICE_NAME,device_type:DEVICE_TYPE}) });
            setConn(true);
        } catch(e) { setConn(false); }
    }
    function setConn(on) {
        document.getElementById('status-dot').className = `conn-dot ${on?'on':'off'}`;
        document.getElementById('status-text').textContent = on ? 'Connected' : 'Offline';
    }

    async function loadBranding() {
        try {
            const res = await fetch(`${API}/settings/all`);
            if (!res.ok) return;
            const d = await res.json();
            if (d.company_logo) { const img = document.getElementById('kiosk-logo'); img.src = d.company_logo; img.onload = () => img.style.display = 'block'; }
            if (d.business_name) { document.getElementById('kiosk-biz-name').textContent = d.business_name; document.title = `Terminal — ${d.business_name}`; }
        } catch(e) {}
    }

    function startClock() {
        function tick() {
            const n = new Date();
            document.getElementById('live-clock').textContent = n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
            document.getElementById('live-date').textContent = n.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
        }
        tick(); setInterval(tick, 1000);
    }

    function initSocket() {
        if (typeof io === 'undefined') return;
        const s = io();
        s.on('connect', () => setConn(true));
        s.on('disconnect', () => setConn(false));
    }

    let scannerBound = false;
    function initScanner() {
        if (scannerBound) return; scannerBound = true;
        document.addEventListener('keydown', e => {
            const a = document.activeElement;
            if (!document.getElementById('login-gate').classList.contains('off')) return;
            // Skip if user is typing in ANY input, textarea, or select element
            if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return;
            if (e.key==='Enter' && scanBuffer.length>=1) { processScan(scanBuffer.trim()); scanBuffer=''; clearTimeout(scanTimeout); return; }
            if (e.key.length===1) { scanBuffer+=e.key; clearTimeout(scanTimeout); scanTimeout=setTimeout(()=>{scanBuffer='';},300); }
        });
        document.getElementById('manual-id').addEventListener('keydown', e => { if (e.key==='Enter'){e.preventDefault();manualScan();} });
    }

    function manualScan() { const v=document.getElementById('manual-id').value.trim(); if(!v)return; processScan(v); document.getElementById('manual-id').value=''; }

    function openCamScanner() {
        document.getElementById('cam-wrap').classList.add('show');
        if (camScanner) return;
        camScanner = new Html5Qrcode('cam-reader');
        camScanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}}, code=>{closeCamScanner();processScan(code);}, ()=>{}).catch(()=>{alert('Camera unavailable');closeCamScanner();});
    }
    function closeCamScanner() {
        document.getElementById('cam-wrap').classList.remove('show');
        if (camScanner){camScanner.stop().catch(()=>{});camScanner.clear();camScanner=null;}
    }

    async function processScan(id) {
        if (!kioskToken) { showGate(); return; }
        resetIdle();
        const zone = document.getElementById('scan-zone');
        zone.style.borderColor = 'var(--accent)';
        try {
            const res = await fetch(`${API}/kiosk/scan`, { method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${kioskToken}`}, body:JSON.stringify({identifier:id,device_id:DEVICE_ID}) });
            const data = await res.json();
            if (res.ok) {
                const out = data.action === 'OUT';
                popup(data.already_in ? 'note' : 'ok', out ? '\u2190' : '\u2713', data.name, data.message);
                addLog(data.name, data.action || 'IN');
            } else { popup('bad', '\u2717', 'Denied', data.error || 'Unknown error'); }
        } catch(e) { popup('bad', '!', 'Error', 'Cannot reach server'); }
        setTimeout(() => { zone.style.borderColor = ''; }, 400);
    }

    function popup(type, icon, name, msg) {
        const o = document.getElementById('result-overlay');
        document.getElementById('result-card').className = `res-card ${type}`;
        document.getElementById('result-icon').textContent = icon;
        document.getElementById('result-name').textContent = name;
        document.getElementById('result-msg').textContent = msg;
        document.getElementById('result-time').textContent = new Date().toLocaleTimeString('en-GB');
        o.classList.add('show');
        setTimeout(() => o.classList.remove('show'), 3500);
        o.onclick = () => o.classList.remove('show');
    }

    function addLog(name, action) {
        activityLog.unshift({name, action, time: new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})});
        if (activityLog.length > 20) activityLog.length = 20;
        const el = document.getElementById('log-list');
        el.innerHTML = activityLog.map(e => `<div class="feed-item"><span class="feed-dot ${e.action==='OUT'?'out':'in'}"></span><span class="feed-name">${e.name}</span><span class="feed-meta">${e.action==='OUT'?'Out':'In'} \u00b7 ${e.time}</span></div>`).join('');
    }

    init();
    </script>
</body>
</html>
